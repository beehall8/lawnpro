services:
  - type: web
    name: lawnpro-api
    runtime: node
    rootDir: src/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lawnpro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VENDOR_ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lawnproatl.com,https://www.lawnproatl.com

databases:
  - name: lawnpro-db
    databaseName: lawnpro
    user: lawnpro
